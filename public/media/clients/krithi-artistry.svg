<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a081a"/>
      <stop offset="100%" stop-color="#0c0207"/>
    </linearGradient>
    <linearGradient id="pinkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="90" fill="url(#roseGrad)"/>
  <!-- Luxury Monogram KM -->
  <circle cx="250" cy="190" r="85" fill="none" stroke="url(#pinkGold)" stroke-width="6" opacity="0.6"/>
  <circle cx="250" cy="190" r="75" fill="none" stroke="url(#pinkGold)" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="250" y="215" font-family="'Unbounded', serif" font-size="78" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">KM</text>
  <!-- Brand Typography -->
  <text x="250" y="335" font-family="'Unbounded', 'DM Sans', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">KRITHI</text>
  <text x="250" y="375" font-family="'DM Sans', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f472b6" text-anchor="middle" letter-spacing="10">MAKEOVER ARTISTRY</text>
  <line x1="160" y1="405" x2="340" y2="405" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <text x="250" y="430" font-family="monospace" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="5">BRIDAL &amp; LUXURY BEAUTY</text>
</svg>
